[tool.poetry]
name = "continuoussets"
version = "1.0.0"
authors = ["Mark Wetzlinger <m.wetzlinger@tum.de>"]
description = "A package for set-based computing."
readme = "README.md"
license = "GNU"
keywords = [
  "Set-based computing",
  "Interval arithmetic",
  "Zonotopes",
  "Polytopes"
]

[tool.poetry.dependencies]
python = "^3.9"
matplotlib = "^3.3.0"
numpy = "^1.20.0"
scipy = "^1.6.0"
pypoman = "^1.1.0"

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
pytest = "^7.2.0"
coverage = "^7.2.0"

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__",
    "@abstractmethod",
    "if TYPE_CHECKING:",
    ]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
